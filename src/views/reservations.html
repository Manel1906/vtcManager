<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Réservations VTC</title>

    <link
        rel="stylesheet"
        href="/css/reservations.css"
    >

    <link
        rel="stylesheet"
        href="css/navigation.css"
    >

</head>

<body>

<div class="app">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <!-- IDENTITÉ -->

        <div class="header-brand">

            <img
                src="/images/icons/icon-192.png"
                alt="Logo VTC Manager"
                class="header-logo"
            >

            <div>

                <h1>VTC Manager</h1>

                <p>Gestion des réservations</p>

            </div>

        </div>


        <!-- =================================================
             NAVIGATION
        ================================================== -->

        <nav
            class="navigation"
            aria-label="Navigation principale"
        >

            <a href="/dashboard">
                🏠 Dashboard
            </a>

            <a
                href="/reservations"
                class="active"
                aria-current="page"
            >
                📋 Réservations
            </a>

            <a href="/">
                📄 Bon de réservation
            </a>

            <!-- ADMIN UNIQUEMENT -->

            <a
                href="/comptes"
                id="comptesNavLink"
                class="admin-only"
                style="display: none;"
            >
                👥 Gestion des comptes
            </a>

            <!-- UTILISATEUR CONNECTÉ -->

            <div
                class="nav-user"
                id="navUser"
            >

                <img
                    id="navUserPhoto"
                    src="/images/default-avatar.png"
                    alt="Profil"
                    class="nav-user-photo"
                >

                <span
                    id="navUserName"
                    class="nav-user-name"
                >
                    Utilisateur
                </span>

            </div>

            <!-- DÉCONNEXION -->

            <button
                type="button"
                id="logoutButton"
                class="logout-button"
            >
                Déconnexion
            </button>

        </nav>

    </header>


    <!-- =====================================================
         CONTENU PRINCIPAL
    ====================================================== -->

    <main>

        <!-- =================================================
             INTRODUCTION
        ================================================== -->

        <section class="page-intro">

            <div class="page-intro-text">

                <h2>Gestion des réservations</h2>

                <p>
                    Consultez, recherchez et téléchargez vos réservations.
                </p>

            </div>

            <a
                href="/"
                class="new-button"
            >
                + Nouvelle réservation
            </a>

        </section>


        <!-- =================================================
             FILTRES
        ================================================== -->

        <section
            class="filters-card"
            aria-label="Filtres des réservations"
        >

            <!-- RECHERCHE -->

            <div class="filter-group search-group">

                <label for="searchInput">
                    Rechercher
                </label>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Client, passager, départ, destination..."
                    autocomplete="off"
                >

            </div>


            <!-- DATE -->

            <div class="filter-group">

                <label for="dateFilter">
                    Date de prise en charge
                </label>

                <input
                    type="date"
                    id="dateFilter"
                >

            </div>


            <!-- STATUT -->

            <div class="filter-group">

                <label for="statusFilter">
                    Statut
                </label>

                <select id="statusFilter">

                    <option value="toutes">
                        Toutes
                    </option>

                    <option value="avenir">
                        À venir
                    </option>

                    <option value="terminees">
                        Terminées
                    </option>

                </select>

            </div>


            <!-- RESET -->

            <button
                type="button"
                id="resetFilters"
                class="reset-button"
            >
                Réinitialiser
            </button>

        </section>


        <!-- =================================================
             BARRE DES RÉSULTATS
        ================================================== -->

        <section
            class="results-bar"
            aria-label="Résultats"
        >

            <strong id="resultsCount">
                0 réservation
            </strong>

            <button
                type="button"
                id="refreshButton"
                class="refresh-button"
            >
                ↻ Actualiser
            </button>

        </section>


        <!-- =================================================
             TABLEAU DES RÉSERVATIONS
        ================================================== -->

        <section
            class="reservations-card"
            aria-label="Liste des réservations"
        >

            <div id="reservationsContainer">

                <div class="loading">
                    Chargement des réservations...
                </div>

            </div>

        </section>

    </main>

</div>


<!-- =====================================================
     JAVASCRIPT NAVIGATION
====================================================== -->

<script src="/js/navigation.js"></script>


<!-- =====================================================
     JAVASCRIPT RÉSERVATIONS
====================================================== -->

<script src="/js/reservations.js"></script>
<!-- =====================================================
     MODAL PHOTO PROFIL
====================================================== -->

<div id="profilePhotoModal" class="profile-photo-modal">

    <button
        type="button"
        id="closeProfilePhoto"
        class="profile-photo-close"
        aria-label="Fermer"
    >
        ×
    </button>

    <img
        id="profilePhotoFull"
        src="/images/default-avatar.png"
        alt="Photo de profil"
    >

</div>
</body>
</html>
